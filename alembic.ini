# Alembic 配置文件
# 用于 ThinkPython 数据库迁移管理

[alembic]
# 迁移脚本目录
script_location = alembic

# 模板文件名（用于生成新迁移脚本）
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev).4d_%%(slug)s

# 时区设置
timezone = Asia/Shanghai

# 是否输出 SQL 日志
echo = false

# 数据库 URL（会被 migrate.py 动态覆盖，此处仅作为默认值）
sqlalchemy.url = sqlite:///./thinkpython.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
