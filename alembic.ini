# Alembic configuration for ThinkPython
#
# IMPORTANT: keep this file ASCII-only.
# configparser reads this file with the system locale encoding. On Windows with
# a GBK/CP936 locale, non-ASCII comments make Alembic fail with
# "'gbk' codec can't decode byte ..." before any migration logic runs.
# User-facing Chinese documentation lives in docs/ instead.

[alembic]
# Directory holding migration scripts (relative to this file).
script_location = alembic

# Add the project root to sys.path so `config`, `app` and `core` are importable.
prepend_sys_path = .

# Filename template for generated revisions.
# NOTE: %(rev)s must stay a string placeholder. The revision id is a hex string,
# so a numeric format such as %(rev).4d raises "%d format: a real number is
# required, not str" and migration generation fails.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# Truncate long slug parts.
truncate_slug_length = 40

# Emit SQL to stdout during migrations (debugging aid).
echo = false

# Fallback URL only. alembic/env.py overwrites it with the value resolved from
# the application configuration (DATABASE_URL / DB_TYPE) converted to a
# synchronous driver.
sqlalchemy.url = sqlite:///./data/database.db


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
