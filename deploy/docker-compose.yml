# ThinkPython 生产部署编排：应用 + MySQL + Redis + Nginx
#
# 使用步骤：
#   1. cp .env.example .env      # 在 deploy/ 目录内执行，并填写真实密钥与密码
#   2. docker compose up -d --build
#   3. curl http://localhost/health
#
# 首次启动会自动执行数据库迁移（见 app.command）。
# 多副本部署时请去掉 command 里的迁移步骤，改为发布流程中的单独 Job，
# 避免多个副本并发执行 DDL。

services:
  # ==============================
  # 应用服务
  # ==============================
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: thinkpython:latest
    container_name: thinkpython-app
    restart: unless-stopped
    # 生产配置集中放在 deploy/.env（不要与仓库根的开发用 .env 混用）
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      APP_DEBUG: "false"
      DB_TYPE: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: thinkpython
      CACHE_TYPE: redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUTH_ENABLED: "true"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_BACKEND: redis
      # 容器内 CPU 核数可能读到宿主机，显式限制 worker 数
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-4}"
    # 启动前先迁移，再交给 gunicorn；迁移失败会中断启动（非零退出码）
    command: >
      sh -c "python think.py db-migrate --upgrade &&
             gunicorn -c deploy/gunicorn.conf.py main:app"
    volumes:
      - app-logs:/app/logs
      - app-uploads:/app/uploads
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - thinkpython-network

  # ==============================
  # MySQL 数据库
  # ==============================
  db:
    image: mysql:8.0
    container_name: thinkpython-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?请在 deploy/.env 中设置 DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: thinkpython
      TZ: Asia/Shanghai
    volumes:
      - db-data:/var/lib/mysql
      # 仅在数据卷为空时执行；修改后需 down -v 才能重新生效
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # 生产环境不要对外暴露数据库端口，仅在调试时临时放开
    # ports:
    #   - "3306:3306"
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - thinkpython-network

  # ==============================
  # Redis 缓存
  # ==============================
  redis:
    image: redis:7-alpine
    container_name: thinkpython-redis
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ];
             then exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
             else exec redis-server --appendonly yes; fi'
    env_file:
      - .env
    volumes:
      - redis-data:/data
    # 生产环境不要对外暴露 Redis 端口
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - thinkpython-network

  # ==============================
  # Nginx 反向代理
  # ==============================
  nginx:
    image: nginx:alpine
    container_name: thinkpython-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      # 与 app 共享上传目录，Nginx 才能直接返回静态文件
      - app-uploads:/app/uploads:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - thinkpython-network

# ==============================
# 数据卷
# ==============================
volumes:
  db-data:
  redis-data:
  app-logs:
  app-uploads:

# ==============================
# 网络
# ==============================
networks:
  thinkpython-network:
    driver: bridge
