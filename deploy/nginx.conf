# Nginx 反向代理配置 - 生产环境部署示例
# 此文件为参考配置，用户可根据实际需求调整

# HTTP 服务器（可配置重定向到 HTTPS）
server {
    listen 80;
    server_name your_domain.com www.your_domain.com;  # 替换为实际域名
    
    # 可选：将所有 HTTP 请求重定向到 HTTPS
    # return 301 https://$server_name$request_uri;
    
    # 静态文件直接由 Nginx 处理
    location /uploads/ {
        alias /app/uploads/;
        expires 30d;  # 静态文件缓存 30 天
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # 反向代理到 ThinkPython 应用
    location / {
        proxy_pass http://app:8000;  # Docker 环境使用服务名
        # proxy_pass http://127.0.0.1:8000;  # 非 Docker 环境使用
        
        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持（如果需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
    
    # 健康检查端点（用于负载均衡器检测）
    location /health {
        proxy_pass http://app:8000;
        access_log off;
    }
    
    # 禁止访问隐藏文件和敏感目录
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 日志配置
    access_log /var/log/nginx/thinkpython_access.log;
    error_log /var/log/nginx/thinkpython_error.log;
}

